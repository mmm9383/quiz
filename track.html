<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Management Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .dashboard-card {
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .dashboard-card .number { font-size: 2.5em; font-weight: bold; margin-bottom: 10px; }
    .dashboard-card .label { font-size: 0.9em; opacity: 0.8; }
    .controls {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }
    .search-box, .filter-select {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
      min-width: 200px;
    }
    .search-box::placeholder { color: rgba(255, 255, 255, 0.7); }
    .filter-select option { background: #444; color: white; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-primary:hover { background: #45a049; transform: translateY(-2px); }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #da190b; transform: translateY(-2px); }
    .btn-warning { background: #ff9800; color: white; }
    .btn-warning:hover { background: #e68900; transform: translateY(-2px); }
    .btn-info { background: #2196F3; color: white; }
    .btn-info:hover { background: #1976D2; transform: translateY(-2px); }
    .btn-small { padding: 5px 10px; font-size: 12px; }
    .current-access, .quiz-info {
      background: rgba(255, 255, 255, 0.1);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .stat-label { font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
    .stat-value { font-size: 2em; font-weight: bold; margin-bottom: 10px; }
    .quiz-meta { font-size: 14px; margin-top: 15px; opacity: 0.9; }
    .quiz-meta div { margin-bottom: 5px; }
    .quiz-link { color: #a3bffa; text-decoration: none; }
    .quiz-link:hover { text-decoration: underline; }
    .loading, .error { padding: 20px; text-align: center; }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .progress-bar {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      background: linear-gradient(90deg, #4CAF50, #45a049);
      height: 100%;
      transition: width 0.3s;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }
    .modal-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 15% auto;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      color: white;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      right: 20px;
      top: 15px;
    }
    .close:hover { color: white; }
    .export-section {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .sort-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .alert {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      display: none;
    }
    .alert-success { background: rgba(76, 175, 80, 0.3); border-left: 4px solid #4CAF50; }
    .alert-error { background: rgba(244, 67, 54, 0.3); border-left: 4px solid #f44336; }
    .alert-warning { background: rgba(255, 152, 0, 0.3); border-left: 4px solid #ff9800; }
    @media (max-width: 768px) {
      .dashboard-stats { grid-template-columns: 1fr 1fr; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-box, .filter-select { min-width: auto; }
      .sort-options { margin-left: 0; justify-content: center; }
    }
  </style>

</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Quiz Management Dashboard</h1>
      <p>Complete quiz tracking and management system</p>
    </div>

    <div id="alerts"></div>

    <div class="dashboard-stats">
      <div class="dashboard-card">
        <div class="number" id="total-quizzes">0</div>
        <div class="label">Total Quizzes</div>
      </div>
      <div class="dashboard-card">
        <div class="number" id="total-opens">0</div>
        <div class="label">Total Opens</div>
      </div>
      <div class="dashboard-card">
        <div class="number" id="total-completions">0</div>
        <div class="label">Total Completions</div>
      </div>
      <div class="dashboard-card">
        <div class="number" id="avg-score">0%</div>
        <div class="label">Average Score</div>
      </div>
    </div>

    <div id="current-quiz" class="current-access">
      <div class="loading">Loading quiz information...</div>
    </div>

    <div class="export-section">
      <h3>📊 Data Export</h3>
      <button class="btn btn-info" onclick="exportToCSV()">Export to CSV</button>
      <button class="btn btn-info" onclick="exportToJSON()">Export to JSON</button>
    </div>

    <div class="controls">
      <input type="text" class="search-box" id="search-input" placeholder="🔍 Search quizzes..." onkeyup="filterQuizzes()">
      <select class="filter-select" id="filter-select" onchange="filterQuizzes()">
        <option value="all">All Quizzes</option>
        <option value="completed">Completed Only</option>
        <option value="not-completed">Not Completed</option>
        <option value="high-score">High Score (>80%)</option>
      </select>
      <div class="sort-options">
        <button class="btn btn-small btn-primary" onclick="sortQuizzes('name')">Sort by Name</button>
        <button class="btn btn-small btn-primary" onclick="sortQuizzes('lastAccessed')">Sort by Date</button>
        <button class="btn btn-small btn-primary" onclick="sortQuizzes('averageScore')">Sort by Score</button>
      </div>
      <button class="btn btn-danger" onclick="showClearAllModal()">🗑️ Clear All Data</button>
    </div>

    <div class="quiz-info">
      <h2>📚 Quiz Statistics</h2>
      <div id="stats-grid" class="stat-grid">
        <div class="loading">Loading statistics...</div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>⚠️ Confirm Deletion</h2>
      <p id="deleteMessage">Are you sure you want to delete this quiz data?</p>
      <div style="margin-top: 20px;">
        <button class="btn btn-danger" onclick="confirmDelete()">Yes, Delete</button>
        <button class="btn btn-primary" onclick="closeModal()" style="margin-left: 10px;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let currentQuizData = [];
    let currentDeleteId = null;
    let currentDeleteType = 'single';
    let currentSort = 'lastAccessed';
    let sortDirection = 'desc';

    function showAlert(message, type = 'success') {
      const alertsDiv = document.getElementById('alerts');
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.innerHTML = message;
      alertDiv.style.display = 'block';
      alertsDiv.appendChild(alertDiv);
      setTimeout(() => alertDiv.remove(), 5000);
    }

    function processTrackingData() {
      try {
        const params = new URLSearchParams(window.location.search);
        const quizName = params.get('quiz') || params.get('quiz_title');
        const quizId = params.get('id') || params.get('quiz_id');
        const timestamp = params.get('timestamp') || Date.now();
        const eventType = params.get('eventType') || params.get('event_type');
        const score = params.get('score');
        const totalQuestions = params.get('total_questions');
        const timeSpent = params.get('time_spent');

        if (quizId) {
          updateCurrentQuizDisplay(quizName, quizId, timestamp, eventType, score, totalQuestions);
          recordQuizAccess(quizId, quizName, eventType, score, totalQuestions, timeSpent);
          setTimeout(() => {
            displayAllStats();
            updateDashboardStats();
          }, 1000);
        } else {
          displayAllStats();
          updateDashboardStats();
        }
      } catch (error) {
        console.error('Error processing tracking data:', error);
        showAlert('Error processing tracking data', 'error');
      }
    }

    function updateCurrentQuizDisplay(name, id, timestamp, eventType, score, totalQuestions) {
      const currentQuizDiv = document.getElementById('current-quiz');
      if (!id) {
        currentQuizDiv.innerHTML = '<div>No active quiz session detected</div>';
        return;
      }

      const eventTypeDisplay = {
        'quiz_open': '🚀 Quiz Opened',
        'quiz_complete': '✅ Quiz Completed',
        'default': '📝 Quiz Activity'
      }[eventType] || eventType;

      currentQuizDiv.innerHTML = `
        <div style="font-size: 1.3em; margin-bottom: 15px;">📝 Current Quiz Activity</div>
        ${name ? `<div style="margin-bottom: 8px;"><strong>Quiz:</strong> ${decodeURIComponent(name)}</div>` : ''}
        <div style="margin-bottom: 8px;"><strong>ID:</strong> ${id}</div>
        <div style="margin-bottom: 8px;"><strong>Event:</strong> ${eventTypeDisplay}</div>
        <div style="margin-bottom: 8px;"><strong>Time:</strong> ${new Date(parseInt(timestamp)).toLocaleString()}</div>
        ${score ? `<div style="margin-bottom: 8px;"><strong>Score:</strong> ${score}%${totalQuestions ? ` (${Math.round(score * totalQuestions / 100)}/${totalQuestions})` : ''}</div>` : ''}
      `;
    }

    function recordQuizAccess(id, name, eventType, score, totalQuestions, timeSpent) {
      try {
        const now = new Date().toISOString();
        const ref = firebase.database().ref('quizzes/' + id);

        ref.once('value').then(snapshot => {
          const quizData = snapshot.val() || {};
          
          const updatedData = {
            name: name || quizData.name || `Quiz ${id}`,
            firstAccessed: quizData.firstAccessed || now,
            lastAccessed: now,
            timesOpened: quizData.timesOpened || 0,
            timesCompleted: quizData.timesCompleted || 0,
            totalScore: quizData.totalScore || 0,
            averageScore: quizData.averageScore || 0,
            totalTimeSpent: quizData.totalTimeSpent || 0,
            totalQuestions: totalQuestions || quizData.totalQuestions || 0
          };

          if (eventType === 'quiz_open') {
            updatedData.timesOpened = (quizData.timesOpened || 0) + 1;
          } else if (eventType === 'quiz_complete') {
            updatedData.timesCompleted = (quizData.timesCompleted || 0) + 1;
            
            if (score) {
              updatedData.totalScore = (quizData.totalScore || 0) + parseInt(score);
              updatedData.averageScore = updatedData.totalScore / updatedData.timesCompleted;
            }
            
            if (timeSpent) {
              updatedData.totalTimeSpent = (quizData.totalTimeSpent || 0) + parseInt(timeSpent);
            }
          }

          return ref.set(updatedData);
        }).then(() => {
          console.log('✅ Quiz data updated in Firebase');
          showAlert('Quiz data updated successfully!', 'success');
        }).catch((error) => {
          console.error('❌ Firebase write error:', error);
          showAlert('Error updating quiz data', 'error');
        });
      } catch (error) {
        console.error('❌ Error in recordQuizAccess:', error);
        showAlert('Error recording quiz access', 'error');
      }
    }

    function displayAllStats() {
      const statsGrid = document.getElementById('stats-grid');
      const ref = firebase.database().ref('quizzes');

      ref.once('value').then(snapshot => {
        const data = snapshot.val() || {};
        const quizzes = Object.entries(data).map(([id, quiz]) => ({
          id,
          ...quiz
        }));

        currentQuizData = quizzes;
        renderQuizzes(quizzes);
      }).catch(error => {
        console.error('❌ Error loading stats from Firebase:', error);
        statsGrid.innerHTML = '<div class="error">Error loading statistics</div>';
      });
    }

    function renderQuizzes(quizzes) {
      const statsGrid = document.getElementById('stats-grid');
      
      if (quizzes.length === 0) {
        statsGrid.innerHTML = '<div class="loading">No quiz data available yet</div>';
        return;
      }

      statsGrid.innerHTML = quizzes.map(quiz => {
        const completionRate = quiz.timesOpened > 0 ? (quiz.timesCompleted / quiz.timesOpened * 100) : 0;
        const avgTime = quiz.timesCompleted > 0 ? Math.round(quiz.totalTimeSpent / quiz.timesCompleted) : 0;
        
        return `
          <div class="stat-card">
            <div class="stat-label">📋 ${quiz.name || `Quiz ${quiz.id}`}</div>
            <div class="stat-value">${quiz.timesOpened || 0} opens</div>
            <div class="quiz-meta">
              <div><strong>✅ Completed:</strong> ${quiz.timesCompleted || 0} times</div>
              <div><strong>📊 Completion Rate:</strong> ${completionRate.toFixed(1)}%</div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${completionRate}%"></div>
              </div>
              ${quiz.averageScore ? `<div><strong>🎯 Avg Score:</strong> ${Math.round(quiz.averageScore)}%</div>` : ''}
              ${quiz.totalTimeSpent ? `<div><strong>⏱️ Avg Time:</strong> ${avgTime}s</div>` : ''}
              <div><strong>📅 Last Access:</strong> ${quiz.lastAccessed ? new Date(quiz.lastAccessed).toLocaleDateString() : 'Never'}</div>
              <div><strong>❓ Questions:</strong> ${quiz.totalQuestions || 'N/A'}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-small btn-warning" onclick="resetQuizStats('${quiz.id}')">🔄 Reset Stats</button>
              <button class="btn btn-small btn-danger" onclick="deleteQuiz('${quiz.id}', '${quiz.name}')">🗑️ Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateDashboardStats() {
      const ref = firebase.database().ref('quizzes');
      ref.once('value').then(snapshot => {
        const data = snapshot.val() || {};
        const quizzes = Object.values(data);
        
        const totalQuizzes = quizzes.length;
        const totalOpens = quizzes.reduce((sum, quiz) => sum + (quiz.timesOpened || 0), 0);
        const totalCompletions = quizzes.reduce((sum, quiz) => sum + (quiz.timesCompleted || 0), 0);
        const avgScore = quizzes.length > 0 ? 
          quizzes.reduce((sum, quiz) => sum + (quiz.averageScore || 0), 0) / quizzes.length : 0;

        document.getElementById('total-quizzes').textContent = totalQuizzes;
        document.getElementById('total-opens').textContent = totalOpens;
        document.getElementById('total-completions').textContent = totalCompletions;
        document.getElementById('avg-score').textContent = Math.round(avgScore) + '%';
      });
    }

    function deleteQuiz(id, name) {
      currentDeleteId = id;
      currentDeleteType = 'single';
      document.getElementById('deleteMessage').textContent = 
        `Are you sure you want to delete "${name}" and all its data? This action cannot be undone.`;
      document.getElementById('deleteModal').style.display = 'block';
    }

    function resetQuizStats(id) {
      if (confirm('Are you sure you want to reset all statistics for this quiz? This will keep the quiz but reset all counters to zero.')) {
        const ref = firebase.database().ref('quizzes/' + id);
        ref.once('value').then(snapshot => {
          const quiz = snapshot.val();
          if (quiz) {
            const resetData = {
              name: quiz.name,
              firstAccessed: new Date().toISOString(),
              lastAccessed: new Date().toISOString(),
              timesOpened: 0,
              timesCompleted: 0,
              totalScore: 0,
              averageScore: 0,
              totalTimeSpent: 0,
              totalQuestions: quiz.totalQuestions || 0
            };
            
            ref.set(resetData).then(() => {
              showAlert('Quiz statistics reset successfully!', 'success');
              displayAllStats();
              updateDashboardStats();
            }).catch(error => {
              showAlert('Error resetting quiz statistics', 'error');
              console.error(error);
            });
          }
        });
      }
    }

    function showClearAllModal() {
      currentDeleteType = 'all';
      document.getElementById('deleteMessage').textContent = 
        'Are you sure you want to delete ALL quiz data? This will permanently remove all quizzes and statistics. This action cannot be undone.';
      document.getElementById('deleteModal').style.display = 'block';
    }

    function confirmDelete() {
      if (currentDeleteType === 'single' && currentDeleteId) {
        const ref = firebase.database().ref('quizzes/' + currentDeleteId);
        ref.remove().then(() => {
          showAlert('Quiz deleted successfully!', 'success');
          displayAllStats();
          updateDashboardStats();
          closeModal();
        }).catch(error => {
          showAlert('Error deleting quiz', 'error');
          console.error(error);
        });
      } else if (currentDeleteType === 'all') {
        const ref = firebase.database().ref('quizzes');
        ref.remove().then(() => {
          showAlert('All quiz data cleared successfully!', 'success');
          displayAllStats();
          updateDashboardStats();
          closeModal();
        }).catch(error => {
          showAlert('Error clearing all data', 'error');
          console.error(error);
        });
      }
    }

    function closeModal() {
      document.getElementById('deleteModal').style.display = 'none';
      currentDeleteId = null;
    }

    function filterQuizzes() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const filterType = document.getElementById('filter-select').value;
      
      let filteredQuizzes = currentQuizData.filter(quiz => {
        const matchesSearch = quiz.name.toLowerCase().includes(searchTerm);
        let matchesFilter = true;
        
        switch (filterType) {
          case 'completed':
            matchesFilter = quiz.timesCompleted > 0;
            break;
          case 'not-completed':
            matchesFilter = quiz.timesCompleted === 0;
            break;
          case 'high-score':
            matchesFilter = quiz.averageScore > 80;
            break;
        }
        
        return matchesSearch && matchesFilter;
      });
      
      renderQuizzes(filteredQuizzes);
    }

    function sortQuizzes(sortBy) {
      if (currentSort === sortBy) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort = sortBy;
        sortDirection = 'desc';
      }
      
      currentQuizData.sort((a, b) => {
        let aVal = a[sortBy];
        let bVal = b[sortBy];
        
        if (sortBy === 'name') {
          aVal = aVal || '';
          bVal = bVal || '';
        } else if (sortBy === 'lastAccessed') {
          aVal = new Date(aVal || 0);
          bVal = new Date(bVal || 0);
        } else {
          aVal = aVal || 0;
          bVal = bVal || 0;
        }
        
        if (sortDirection === 'asc') {
          return aVal > bVal ? 1 : -1;
        } else {
          return aVal < bVal ? 1 : -1;
        }
      });
      
      renderQuizzes(currentQuizData);
    }

    function exportToCSV() {
      const headers = ['Name', 'Times Opened', 'Times Completed', 'Average Score', 'Total Time Spent', 'Total Questions', 'First Accessed', 'Last Accessed'];
      const csvContent = [
        headers.join(','),
        ...currentQuizData.map(quiz => [
          `"${quiz.name || ''}"`,
          quiz.timesOpened || 0,
          quiz.timesCompleted || 0,
          Math.round(quiz.averageScore || 0),
          quiz.totalTimeSpent || 0,
          quiz.totalQuestions || 0,
          quiz.firstAccessed || '',
          quiz.lastAccessed || ''
        ].join(','))
      ].join('\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quiz-data-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showAlert('CSV exported successfully!', 'success');
    }

    function exportToJSON() {
      const jsonContent = JSON.stringify(currentQuizData, null, 2);
      const blob = new Blob([jsonContent], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quiz-data-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showAlert('JSON exported successfully!', 'success');
    }

    // Initialize
    try {
      processTrackingData();
      setInterval(() => {
        displayAllStats();
        updateDashboardStats();
      }, 30000); // auto-refresh every 30 seconds
      console.log('Quiz management dashboard initialized');
    } catch (error) {
      console.error('Initialization error:', error);
      showAlert('Error initializing dashboard', 'error');
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('deleteModal');
      if (event.target === modal) {
        closeModal();
      }
    }
