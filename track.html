
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Usage Tracker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .quiz-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-label {
            font-size: 1.1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .quiz-link {
            color: #87ceeb;
            text-decoration: none;
            word-break: break-all;
        }
        .quiz-link:hover {
            color: #ffd700;
        }
        .current-access {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Quiz Usage Tracker</h1>
        
        <div id="current-quiz" class="current-access">
            <div class="loading">Loading quiz information...</div>
        </div>
        
        <div class="quiz-info">
            <h2>📊 All Quiz Statistics</h2>
            <div id="stats-grid" class="stat-grid">
                <div class="loading">Loading statistics...</div>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const quizName = urlParams.get('quiz');
        const quizId = urlParams.get('id');
        const timestamp = urlParams.get('timestamp');
        const quizUrl = urlParams.get('quizUrl');

        function updateCurrentQuizInfo() {
            const currentQuizDiv = document.getElementById('current-quiz');
            
            if (quizName && quizId && timestamp) {
                currentQuizDiv.innerHTML = `
                    <div style="font-size: 1.2em; margin-bottom: 10px;">📝 Current Quiz Access</div>
                    <div><strong>Quiz:</strong> ${decodeURIComponent(quizName)}</div>
                    <div><strong>ID:</strong> ${quizId}</div>
                    <div><strong>Accessed:</strong> ${new Date(parseInt(timestamp)).toLocaleString()}</div>
                    ${quizUrl ? `<div><strong>URL:</strong> <a href="${decodeURIComponent(quizUrl)}" class="quiz-link" target="_blank">${decodeURIComponent(quizUrl)}</a></div>` : ''}
                `;
                
                // Record this access
                recordQuizAccess(quizId, decodeURIComponent(quizName), quizUrl ? decodeURIComponent(quizUrl) : '');
            } else {
                currentQuizDiv.innerHTML = '<div>No current quiz access detected</div>';
            }
        }

        function recordQuizAccess(id, name, url) {
            // Get existing data
            const storageKey = `quiz_${id}`;
            let quizData = JSON.parse(localStorage.getItem(storageKey) || '{}');
            
            // Update quiz data
            quizData.name = name;
            quizData.url = url;
            quizData.timesUsed = (quizData.timesUsed || 0) + 1;
            quizData.lastAccessed = new Date().toISOString();
            quizData.firstAccessed = quizData.firstAccessed || new Date().toISOString();
            
            // Store updated data
            localStorage.setItem(storageKey, JSON.stringify(quizData));
            
            // Update display
            displayAllStats();
        }

        function displayAllStats() {
            const statsGrid = document.getElementById('stats-grid');
            const allQuizzes = {};
            
            // Collect all quiz data from localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('quiz_')) {
                    const quizId = key.replace('quiz_', '');
                    const data = JSON.parse(localStorage.getItem(key));
                    allQuizzes[quizId] = data;
                }
            }
            
            if (Object.keys(allQuizzes).length === 0) {
                statsGrid.innerHTML = '<div class="loading">No quiz data available yet</div>';
                return;
            }
            
            // Sort by most used
            const sortedQuizzes = Object.entries(allQuizzes).sort((a, b) => (b[1].timesUsed || 0) - (a[1].timesUsed || 0));
            
            let html = '';
            sortedQuizzes.forEach(([id, data]) => {
                html += `
                    <div class="stat-card">
                        <div class="stat-label">📋 ${data.name || `Quiz ${id}`}</div>
                        <div class="stat-value">${data.timesUsed || 0}</div>
                        <div style="font-size: 0.9em; margin-top: 10px; opacity: 0.8;">
                            <div><strong>ID:</strong> ${id}</div>
                            <div><strong>Last Used:</strong> ${data.lastAccessed ? new Date(data.lastAccessed).toLocaleDateString() : 'Never'}</div>
                            ${data.url ? `<div><strong>Link:</strong> <a href="${data.url}" class="quiz-link" target="_blank">Open Quiz</a></div>` : ''}
                        </div>
                    </div>
                `;
            });
            
            statsGrid.innerHTML = html;
        }

        // Initialize the page
        updateCurrentQuizInfo();
        displayAllStats();
        
        // Auto-refresh every 30 seconds to show updated stats
        setInterval(displayAllStats, 30000);
        
        console.log('Quiz tracking page loaded successfully');
    </script>
</body>
</html>
