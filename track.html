<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Usage Tracker</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .current-access, .quiz-info {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.15);
      padding: 15px;
      border-radius: 8px;
      transition: transform 0.3s;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }
    .stat-label { font-weight: bold; margin-bottom: 5px; }
    .stat-value { font-size: 24px; font-weight: bold; }
    .quiz-meta { font-size: 14px; margin-top: 10px; opacity: 0.8; }
    .quiz-link { color: #a3bffa; text-decoration: none; }
    .quiz-link:hover { text-decoration: underline; }
    .loading, .error { padding: 20px; text-align: center; }
  </style>
<!-- Load Firebase SDK (compat version) -->
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

<script>
  // ✅ Your Firebase config (safe to expose in public frontend)
  const firebaseConfig = {
    apiKey: "AIzaSyCPdEEdWSjfYrtaaB9MioxOh9evAbVz3Mc",
    authDomain: "fetchtracker.firebaseapp.com",
    databaseURL: "https://fetchtracker-default-rtdb.firebaseio.com",
    projectId: "fetchtracker",
    storageBucket: "fetchtracker.firebasestorage.app",
    messagingSenderId: "770381576602",
    appId: "1:770381576602:web:680b74d24445e736742223"
  };

  // ✅ Initialize Firebase (compat syntax)
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
</script>
</head>
<body>
  <div class="container">
    <h1>🎯 Quiz Usage Tracker</h1>

    <div id="current-quiz" class="current-access">
      <div class="loading">Loading quiz information...</div>
    </div>

    <div class="quiz-info">
      <h2>📊 All Quiz Statistics</h2>
      <div id="stats-grid" class="stat-grid">
        <div class="loading">Loading statistics...</div>
      </div>
    </div>
  </div>

  <script>
    function processTrackingData() {
      try {
        const params = new URLSearchParams(window.location.search);
        const quizName = params.get('quiz') || params.get('quiz_title');
        const quizId = params.get('id') || params.get('quiz_id');
        const timestamp = params.get('timestamp') || Date.now();
        const eventType = params.get('eventType') || params.get('event_type');
        const score = params.get('score');
        const totalQuestions = params.get('total_questions');
        const timeSpent = params.get('time_spent');

        if (quizId) {
          updateCurrentQuizDisplay(quizName, quizId, timestamp, eventType, score, totalQuestions);
          recordQuizAccess(quizId, quizName, eventType, score, totalQuestions, timeSpent);
          displayAllStats();
        }
      } catch (error) {
        console.error('Error processing tracking data:', error);
        document.getElementById('current-quiz').innerHTML = '<div class="error">Error loading tracking data</div>';
      }
    }

    function updateCurrentQuizDisplay(name, id, timestamp, eventType, score, totalQuestions) {
      const currentQuizDiv = document.getElementById('current-quiz');
      if (!id) {
        currentQuizDiv.innerHTML = '<div>No active quiz session detected</div>';
        return;
      }

      const eventTypeDisplay = {
        'quiz_open': 'Quiz Opened',
        'quiz_complete': 'Quiz Completed',
        'default': 'Quiz Activity'
      }[eventType] || eventType;

      currentQuizDiv.innerHTML = `
        <div style="font-size: 1.2em; margin-bottom: 10px;">📝 Current Quiz Activity</div>
        ${name ? `<div><strong>Quiz:</strong> ${decodeURIComponent(name)}</div>` : ''}
        <div><strong>ID:</strong> ${id}</div>
        <div><strong>Event:</strong> ${eventTypeDisplay}</div>
        <div><strong>Time:</strong> ${new Date(parseInt(timestamp)).toLocaleString()}</div>
        ${score ? `<div><strong>Score:</strong> ${score}%${totalQuestions ? ` (${Math.round(score * totalQuestions / 100)}/${totalQuestions})` : ''}</div>` : ''}
      `;
    }

    // 🔧 FIXED: Clean Firebase data recording - no unwanted fields
    function recordQuizAccess(id, name, eventType, score, totalQuestions, timeSpent) {
      try {
        const now = new Date().toISOString();
        const ref = firebase.database().ref('quizzes/' + id);

        ref.once('value').then(snapshot => {
          const quizData = snapshot.val() || {};
          
          // ✅ CLEAN DATA STRUCTURE - Only store what we need
          const updatedData = {
            name: name || quizData.name || `Quiz ${id}`,
            firstAccessed: quizData.firstAccessed || now,
            lastAccessed: now,
            timesOpened: quizData.timesOpened || 0,
            timesCompleted: quizData.timesCompleted || 0,
            totalScore: quizData.totalScore || 0,
            averageScore: quizData.averageScore || 0,
            totalTimeSpent: quizData.totalTimeSpent || 0,
            totalQuestions: totalQuestions || quizData.totalQuestions || 0
            // ❌ REMOVED: url, totalEvents, lastEventType
          };

          // Handle different event types
          if (eventType === 'quiz_open') {
            updatedData.timesOpened = (quizData.timesOpened || 0) + 1;
          } else if (eventType === 'quiz_complete') {
            updatedData.timesCompleted = (quizData.timesCompleted || 0) + 1;
            
            if (score) {
              updatedData.totalScore = (quizData.totalScore || 0) + parseInt(score);
              updatedData.averageScore = updatedData.totalScore / updatedData.timesCompleted;
            }
            
            if (timeSpent) {
              updatedData.totalTimeSpent = (quizData.totalTimeSpent || 0) + parseInt(timeSpent);
            }
          }

          return ref.set(updatedData);
        }).then(() => {
          console.log('✅ Quiz data updated in Firebase');
        }).catch((error) => {
          console.error('❌ Firebase write error:', error);
        });
      } catch (error) {
        console.error('❌ Error in recordQuizAccess:', error);
      }
    }

    function displayAllStats() {
      const statsGrid = document.getElementById('stats-grid');
      const ref = firebase.database().ref('quizzes');

      ref.once('value').then(snapshot => {
        const data = snapshot.val() || {};
        const quizzes = Object.entries(data).map(([id, quiz]) => ({
          id,
          ...quiz
        }));

        quizzes.sort((a, b) =>
          new Date(b.lastAccessed || 0) - new Date(a.lastAccessed || 0)
        );

        statsGrid.innerHTML = quizzes.length > 0
          ? quizzes.map(quiz => `
              <div class="stat-card">
                <div class="stat-label">📋 ${quiz.name || `Quiz ${quiz.id}`}</div>
                <div class="stat-value">Opens: ${quiz.timesOpened || 0}</div>
                <div class="quiz-meta">
                  <div><strong>Completed:</strong> ${quiz.timesCompleted || 0} times</div>
                  ${quiz.averageScore ? `<div><strong>Avg Score:</strong> ${Math.round(quiz.averageScore)}%</div>` : ''}
                  ${quiz.totalTimeSpent ? `<div><strong>Total Time:</strong> ${quiz.totalTimeSpent}s</div>` : ''}
                  <div><strong>Last Access:</strong> ${quiz.lastAccessed ? new Date(quiz.lastAccessed).toLocaleDateString() : 'Never'}</div>
                  <div><strong>Questions:</strong> ${quiz.totalQuestions || 'N/A'}</div>
                </div>
              </div>
            `).join('')
          : '<div class="loading">No quiz data available yet</div>';
      }).catch(error => {
        console.error('❌ Error loading stats from Firebase:', error);
        statsGrid.innerHTML = '<div class="error">Error loading statistics</div>';
      });
    }

    // 🔁 Initialize
    try {
      processTrackingData();
      setInterval(displayAllStats, 30000); // auto-refresh
      console.log('Quiz tracking page initialized');
    } catch (error) {
      console.error('Initialization error:', error);
    }
  </script>
</body>
</html>
