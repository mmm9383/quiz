<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Usage Tracker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .current-access {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .quiz-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 8px;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }
        .stat-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .quiz-meta {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }
        .quiz-link {
            color: #a3bffa;
            text-decoration: none;
        }
        .quiz-link:hover {
            text-decoration: underline;
        }
        .loading, .error {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Quiz Usage Tracker</h1>
        
        <div id="current-quiz" class="current-access">
            <div class="loading">Loading quiz information...</div>
        </div>
        
        <div class="quiz-info">
            <h2>📊 All Quiz Statistics</h2>
            <div id="stats-grid" class="stat-grid">
                <div class="loading">Loading statistics...</div>
            </div>
        </div>
    </div>

    <script>
        // Enhanced tracking handler with error protection and GitHub Pages compatibility
        function processTrackingData() {
            try {
                const params = new URLSearchParams(window.location.search);
                const quizName = params.get('quiz') || params.get('quiz_title');
                const quizId = params.get('id') || params.get('quiz_id');
                const timestamp = params.get('timestamp') || Date.now();
                const quizUrl = params.get('quizUrl') || params.get('quiz_url');
                const eventType = params.get('eventType') || params.get('event_type');
                
                // Additional GitHub Pages specific parameters
                const score = params.get('score');
                const totalQuestions = params.get('total_questions');
                const timeSpent = params.get('time_spent');

                if (quizId) {
                    // Update current quiz display with more details
                    updateCurrentQuizDisplay(quizName, quizId, timestamp, quizUrl, eventType, score, totalQuestions);
                    
                    // Record in localStorage with more comprehensive data
                    recordQuizAccess(quizId, quizName, quizUrl, eventType, score, totalQuestions, timeSpent);
                    
                    // Update statistics display
                    displayAllStats();
                }
            } catch (error) {
                console.error('Error processing tracking data:', error);
                document.getElementById('current-quiz').innerHTML = 
                    '<div class="error">Error loading tracking data</div>';
            }
        }

        function updateCurrentQuizDisplay(name, id, timestamp, url, eventType, score, totalQuestions) {
            const currentQuizDiv = document.getElementById('current-quiz');
            if (!id) {
                currentQuizDiv.innerHTML = '<div>No active quiz session detected</div>';
                return;
            }

            const eventTypeDisplay = {
                'quiz_open': 'Quiz Opened',
                'quiz_complete': 'Quiz Completed',
                'default': 'Quiz Activity'
            }[eventType] || eventType;

            currentQuizDiv.innerHTML = `
                <div style="font-size: 1.2em; margin-bottom: 10px;">📝 Current Quiz Activity</div>
                ${name ? `<div><strong>Quiz:</strong> ${decodeURIComponent(name)}</div>` : ''}
                <div><strong>ID:</strong> ${id}</div>
                <div><strong>Event:</strong> ${eventTypeDisplay}</div>
                <div><strong>Time:</strong> ${new Date(parseInt(timestamp)).toLocaleString()}</div>
                ${score ? `<div><strong>Score:</strong> ${score}%${totalQuestions ? ` (${Math.round(score * totalQuestions / 100)}/${totalQuestions})` : ''}</div>` : ''}
                ${url ? `<div><strong>URL:</strong> <a href="${decodeURIComponent(url)}" class="quiz-link" target="_blank">${decodeURIComponent(url)}</a></div>` : ''}
            `;
        }

        function recordQuizAccess(id, name, url, eventType, score, totalQuestions, timeSpent) {
            try {
                const storageKey = `quiz_${id}`;
                const now = new Date().toISOString();
                const quizData = JSON.parse(localStorage.getItem(storageKey) || {};
                
                // Update quiz data with more comprehensive tracking
                quizData.name = name || quizData.name || `Quiz ${id}`;
                quizData.url = url || quizData.url;
                
                // Increment appropriate counters based on event type
                if (eventType === 'quiz_open') {
                    quizData.timesOpened = (quizData.timesOpened || 0) + 1;
                } else if (eventType === 'quiz_complete') {
                    quizData.timesCompleted = (quizData.timesCompleted || 0) + 1;
                    if (score) {
                        quizData.totalScore = (quizData.totalScore || 0) + parseInt(score);
                        quizData.averageScore = quizData.totalScore / quizData.timesCompleted;
                    }
                }
                
                quizData.totalEvents = (quizData.totalEvents || 0) + 1;
                quizData.lastAccessed = now;
                quizData.firstAccessed = quizData.firstAccessed || now;
                quizData.lastEventType = eventType || quizData.lastEventType;
                
                if (totalQuestions) quizData.totalQuestions = totalQuestions;
                if (timeSpent) quizData.totalTimeSpent = (quizData.totalTimeSpent || 0) + parseInt(timeSpent);
                
                // Store updated data
                localStorage.setItem(storageKey, JSON.stringify(quizData));
            } catch (error) {
                console.error('Error recording quiz access:', error);
            }
        }

        function displayAllStats() {
            try {
                const statsGrid = document.getElementById('stats-grid');
                const quizzes = [];
                
                // Get all quizzes from localStorage
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('quiz_')) {
                        try {
                            const data = JSON.parse(localStorage.getItem(key));
                            quizzes.push({
                                id: key.replace('quiz_', ''),
                                ...data
                            });
                        } catch (e) {
                            console.warn('Error parsing quiz data for key:', key);
                        }
                    }
                }
                
                // Sort by most recently used
                quizzes.sort((a, b) => 
                    new Date(b.lastAccessed || 0) - new Date(a.lastAccessed || 0));
                
                // Display stats with more comprehensive information
                statsGrid.innerHTML = quizzes.length > 0 
                    ? quizzes.map(quiz => `
                        <div class="stat-card">
                            <div class="stat-label">📋 ${quiz.name || `Quiz ${quiz.id}`}</div>
                            <div class="stat-value">${quiz.totalEvents || 0}</div>
                            <div class="quiz-meta">
                                <div><strong>Opened:</strong> ${quiz.timesOpened || 0} times</div>
                                <div><strong>Completed:</strong> ${quiz.timesCompleted || 0} times</div>
                                ${quiz.averageScore ? `<div><strong>Avg Score:</strong> ${Math.round(quiz.averageScore)}%</div>` : ''}
                                <div><strong>Last:</strong> ${quiz.lastAccessed ? new Date(quiz.lastAccessed).toLocaleDateString() : 'Never'}</div>
                                ${quiz.url ? `<div><a href="${quiz.url}" class="quiz-link" target="_blank">Open Quiz</a></div>` : ''}
                            </div>
                        </div>
                    `).join('')
                    : '<div class="loading">No quiz data available yet</div>';
            } catch (error) {
                console.error('Error displaying stats:', error);
                document.getElementById('stats-grid').innerHTML = 
                    '<div class="error">Error loading statistics</div>';
            }
        }

        // Initialize with error handling
        try {
            processTrackingData();
            // Refresh stats every 30 seconds
            setInterval(displayAllStats, 30000);
            console.log('Quiz tracking page initialized');
        } catch (error) {
            console.error('Initialization error:', error);
        }
    </script>
</body>
</html>
