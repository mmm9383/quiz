  <script>
    const quiz = {"userId":2,"title":"123","description":"123","questions":[{"text":"1231","options":["23","123"],"correctAnswer":1,"explanation":"3","timeLimit":30}],"performanceMessages":{"0":"You need more practice!","50":"Getting there!","80":"Great job!"},"randomizeQuestions":false,"id":1,"createdAt":"2025-07-03T12:46:23.047Z","lastAccessed":"2025-07-03T12:58:57.372Z","timesUsed":1,"serverUrl":"https://quiz-maker.serveo.net"};
    let currentQuestionIndex = 0;
    let answers = [];
    let timer;
    let timeSpent = 0;
    let selectedOption = null;

    function startQuiz() {
      document.getElementById('cover').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');

      console.log("Quiz randomization status:", quiz.randomizeQuestions);

      // If randomizeQuestions is enabled, shuffle the questions
      if (quiz.randomizeQuestions) {
        console.log("Randomizing questions...");
        // Create a shuffled clone of the questions array with original indices
        const questionsWithIndices = quiz.questions.map((q, index) => ({ 
          question: q, 
          originalIndex: index 
        }));

        // Fisher-Yates shuffle algorithm
        for (let i = questionsWithIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questionsWithIndices[i], questionsWithIndices[j]] = 
          [questionsWithIndices[j], questionsWithIndices[i]];
        }

        // Replace questions with shuffled questions but keep track of original indices
        quiz.shuffledIndices = questionsWithIndices.map(q => q.originalIndex);
        quiz.originalQuestions = [...quiz.questions];
        quiz.questions = questionsWithIndices.map(q => q.question);

        console.log("Questions have been randomized");
      } else {
        console.log("Questions will be shown in original order");
      }

      showQuestion();
    }

    function showQuestion() {
      const question = quiz.questions[currentQuestionIndex];
      document.getElementById('current-question').textContent = currentQuestionIndex + 1;
      document.getElementById('question-text').textContent = question.text;

      // Display question image if available
      const questionImageContainer = document.getElementById('question-image');
      if (question.imageUrl) {
        questionImageContainer.innerHTML = `<img src="${question.imageUrl}" alt="Question image" class="max-w-full rounded-lg">`;
      } else {
        questionImageContainer.innerHTML = '';
      }

      const optionsContainer = document.getElementById('options');
      // Remove any existing explanation div
      const existingExplanation = optionsContainer.parentNode.querySelector('.mt-4.p-4.bg-gray-50');
      if (existingExplanation) {
        existingExplanation.remove();
      }

      optionsContainer.innerHTML = question.options.map((option, index) => `
        <button
          onclick="selectOption(${index})"
          class="btn btn-outline w-full text-left"
        >
          ${String.fromCharCode(65 + index)}: ${option}
        </button>
      `).join('');

      // Reset the submit button for each question
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submit Answer';
      submitBtn.onclick = function() {
        submitAnswer();
      };

      startTimer(question.timeLimit || 30);
    }

    function selectOption(index) {
      selectedOption = index;
      const buttons = document.getElementById('options').children;
      Array.from(buttons).forEach(btn => {
        btn.classList.remove('bg-blue-50', 'border-blue-500');
      });
      buttons[index].classList.add('bg-blue-50', 'border-blue-500');

      document.getElementById('submit-btn').disabled = false;
    }

    function skipQuestion() {
      clearInterval(timer);
      // Record that this question was skipped with explicit status
      answers.push({
        questionIndex: currentQuestionIndex,
        selectedOption: null,
        timeSpent,
        status: 'skipped'
      });

      currentQuestionIndex++;
      selectedOption = null;

      if (currentQuestionIndex < quiz.questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function startTimer(duration) {
      clearInterval(timer);
      timeSpent = 0;
      let timeLeft = duration;

      document.getElementById('timer').textContent = timeLeft;

      timer = setInterval(() => {
        timeLeft--;
        timeSpent++;
        document.getElementById('timer').textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          handleTimeExpired();
        }
      }, 1000);
    }

    function handleTimeExpired() {
      // Handle case when time expires but no option is selected
      if (selectedOption === null) {
        answers.push({
          questionIndex: currentQuestionIndex,
          selectedOption: -1,  // Mark as no selection
          timeSpent: quiz.questions[currentQuestionIndex].timeLimit || 30,
          status: 'timeExpired'
        });

        showCorrectAnswer();
        enableNextButton();
        return;
      }

      submitAnswer('timeExpired');
    }

    function enableNextButton() {
      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) {
        submitBtn.textContent = currentQuestionIndex < quiz.questions.length - 1 ? 'Next Question' : 'View Results';
        submitBtn.onclick = handleNextQuestion;
        submitBtn.disabled = false;
      }
    }

    function showCorrectAnswer() {
      const question = quiz.questions[currentQuestionIndex];
      const optionsContainer = document.getElementById('options');
      const buttons = optionsContainer.children;

      // Show correct answer
      Array.from(buttons).forEach((btn, index) => {
        if (index === question.correctAnswer) {
          btn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
        }
      });

      // Show explanation if available
      if (question.explanation) {
        const explanationDiv = document.createElement('div');
        explanationDiv.className = 'mt-4 p-4 bg-gray-50 rounded-lg';
        explanationDiv.innerHTML = `<p class="font-semibold">Explanation:</p><p>${question.explanation}</p>`;
        optionsContainer.parentNode.appendChild(explanationDiv);
      }
    }

    function submitAnswer(forcedStatus = null) {
      // Only proceed if an option has been selected or if a status is forced
      if (selectedOption === null && !forcedStatus) {
        return;
      }

      clearInterval(timer);
      const question = quiz.questions[currentQuestionIndex];
      const isCorrect = selectedOption === question.correctAnswer;

      const optionsContainer = document.getElementById('options');
      const buttons = optionsContainer.children;

      // Show correct and wrong answers
      Array.from(buttons).forEach((btn, index) => {
        if (index === question.correctAnswer) {
          btn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
        } else if (index === selectedOption && !isCorrect) {
          btn.classList.add('bg-red-50', 'border-red-500', 'text-red-700');
        }
      });

      // Show explanation if available
      if (question.explanation) {
        const explanationDiv = document.createElement('div');
        explanationDiv.className = 'mt-4 p-4 bg-gray-50 rounded-lg';
        explanationDiv.innerHTML = `
          <p class="font-medium">Explanation:</p>
          <p class="text-gray-600">${question.explanation}</p>
        `;
        optionsContainer.parentNode.appendChild(explanationDiv);
      }

      // Update submit button based on question position
      const submitBtn = document.getElementById('submit-btn');
      if (currentQuestionIndex < quiz.questions.length - 1) {
        submitBtn.textContent = 'Next Question';
      } else {
        submitBtn.textContent = 'View Results';
      }
      submitBtn.onclick = handleNextQuestion;
      submitBtn.disabled = false;

      // If a status is forced (like timeExpired), use that status
      if (forcedStatus) {
        // Add the answer with forced status but don't move to next question yet
        answers.push({
          questionIndex: currentQuestionIndex,
          selectedOption: selectedOption,
          timeSpent,
          status: forcedStatus
        });
      }
    }

    function handleNextQuestion() {
      // Only add answer if not already added (in case of time expired)
      const existingAnswer = answers.find(a => a.questionIndex === currentQuestionIndex);

      if (!existingAnswer) {
        // Determine status based on selected option
        const question = quiz.questions[currentQuestionIndex];
        let status;

        if (selectedOption === null) {
          status = 'skipped';
        } else if (selectedOption === question.correctAnswer) {
          status = 'correct';
        } else {
          status = 'incorrect';
        }

        // Save the answer with the appropriate status
        answers.push({
          questionIndex: currentQuestionIndex,
          selectedOption,
          timeSpent,
          status
        });
      }

      currentQuestionIndex++;
      selectedOption = null; // Reset selected option for next question

      if (currentQuestionIndex < quiz.questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      // Count answers by status
      const correctAnswers = answers.filter(a => a.status === 'correct').length;
      const incorrectAnswers = answers.filter(a => a.status === 'incorrect').length;
      const skippedQuestions = answers.filter(a => a.status === 'skipped').length;
      const timeExpiredQuestions = answers.filter(a => a.status === 'timeExpired').length;
      const totalQuestions = quiz.questions.length;

      const score = Math.round((correctAnswers / totalQuestions) * 100);

      // Track quiz completion
      if (typeof trackQuizComplete === 'function') {
        const totalTimeSpent = answers.reduce((sum, answer) => sum + answer.timeSpent, 0);
        trackQuizComplete(score, totalQuestions, totalTimeSpent);
      }

      document.getElementById('score').textContent = score;

      // Calculate percentages
      const correctPercentage = Math.round((correctAnswers / totalQuestions) * 100);
      const incorrectPercentage = Math.round((incorrectAnswers / totalQuestions) * 100);
      const skippedPercentage = Math.round((skippedQuestions / totalQuestions) * 100);
      const timeExpiredPercentage = Math.round((timeExpiredQuestions / totalQuestions) * 100);

      // Update status tracker
      document.getElementById('correct-percentage').textContent = correctPercentage;
      document.getElementById('correct-count').textContent = correctAnswers;
      document.getElementById('incorrect-percentage').textContent = incorrectPercentage;
      document.getElementById('incorrect-count').textContent = incorrectAnswers;
      document.getElementById('skipped-percentage').textContent = skippedPercentage;
      document.getElementById('skipped-count').textContent = skippedQuestions;
      document.getElementById('time-expired-percentage').textContent = timeExpiredPercentage;
      document.getElementById('time-expired-count').textContent = timeExpiredQuestions;

      // Show performance message
      const thresholds = Object.keys(quiz.performanceMessages)
        .map(Number)
        .sort((a, b) => b - a);

      let message = quiz.performanceMessages[0];
      for (const threshold of thresholds) {
        if (score >= threshold) {
          message = quiz.performanceMessages[threshold];
          break;
        }
      }

      document.getElementById('performance-message').textContent = message;

      // Add review section
      const resultsDiv = document.getElementById('results');
      const reviewDiv = document.createElement('div');
      reviewDiv.className = 'space-y-6 mt-8';

      // Always use the questions in the order they were displayed to the user
      const questionsToReview = quiz.questions;

      questionsToReview.forEach((question, index) => {
        const answer = answers.find(a => a.questionIndex === index) || {
          questionIndex: index,
          selectedOption: null,
          timeSpent: 0,
          status: 'skipped'
        };

        let statusClass = '';
        let statusText = '';

        switch (answer.status) {
          case 'correct':
            statusClass = 'text-green-600';
            statusText = 'Correct';
            break;
          case 'incorrect':
            statusClass = 'text-red-600';
            statusText = 'Incorrect';
            break;
          case 'skipped':
            statusClass = 'text-blue-600';
            statusText = 'Skipped';
            break;
          case 'timeExpired':
            statusClass = 'text-orange-600';
            statusText = 'Time Expired';
            break;
        }

        reviewDiv.innerHTML += `
          <div class="card">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-medium">Question ${index + 1}</h3>
              <div class="flex items-center gap-4">
                <span class="text-sm text-gray-600">
                  Time spent: ${answer.timeSpent}s
                </span>
                <span class="text-sm ${statusClass}">
                  ${statusText}
                </span>
              </div>
            </div>

            <p class="mb-4">${question.text}</p>
            ${question.imageUrl ? `<img src="${question.imageUrl}" alt="Question image" class="mb-4 max-w-full rounded-lg">` : ''}

            <div class="space-y-2">
              ${question.options.map((option, optIndex) => `
                <div class="p-4 rounded-lg ${
                  optIndex === question.correctAnswer
                    ? 'bg-green-50 border-green-500'
                    : (answer.selectedOption !== null && optIndex === answer.selectedOption)
                    ? 'bg-red-50 border-red-500'
                    : 'border border-gray-200'
                }">
                  ${String.fromCharCode(65 + optIndex)}: ${option}
                </div>
              `).join('')}
            </div>

            ${answer.status === 'skipped' ? `
              <div class="mt-4 p-4 bg-blue-50 rounded-lg">
                <p class="text-blue-600">This question was skipped.</p>
              </div>
            ` : ''}

            ${answer.status === 'timeExpired' ? `
              <div class="mt-4 p-4 bg-orange-50 rounded-lg">
                <p class="text-orange-600">Time expired for this question.</p>
              </div>
            ` : ''}

            ${question.explanation ? `
              <div class="mt-4 p-4 bg-gray-50 rounded-lg">
                <p class="font-medium">Explanation:</p>
                <p class="text-gray-600">${question.explanation}</p>
              </div>
            ` : ''}
          </div>
        `;
      });

      resultsDiv.appendChild(reviewDiv);
    }
  </script>
  <script> 
  // Tracking state to prevent duplicates
  let trackingInitialized = false;
  let quizOpenTracked = false;

  // Use the quiz object that will be defined in the main script 
  function initializeTracking() { 
    if (trackingInitialized) return;
    trackingInitialized = true;

    if (typeof quiz !== 'undefined' && quiz.id) { 
      const serverUrl = 'https://quiz-maker.serveo.net'; 
      const trackingUrl = serverUrl + '/api/quizzes/' + quiz.id + '/track'; 

      // Use sendBeacon for reliable tracking even if page closes 
      if (navigator.sendBeacon) { 
        navigator.sendBeacon(trackingUrl); 
      } else { 
        // Fallback to fetch 
        fetch(trackingUrl, { 
          method: 'POST', 
          mode: 'no-cors', 
          credentials: 'omit' 
        }).catch(console.error); 
      } 
    } 
  }

  // Quiz Tracking Script - Updated Version 
  function getQuizData() { 
    // Try to get quiz data from various sources 
    let quizData = { id: null, title: null }; 

    // Method 1: Check global quiz object 
    if (typeof quiz !== 'undefined' && quiz.id) { 
      quizData.id = quiz.id; 
      quizData.title = quiz.title; 
      return quizData; 
    } 

    // Method 2: Check data attributes 
    const quizContainer = document.querySelector('[data-quiz-id]') ||  
                        document.querySelector('.quiz-container') || 
                        document.querySelector('#quiz'); 

    if (quizContainer) { 
      quizData.id = quizContainer.getAttribute('data-quiz-id') ||  
                    quizContainer.getAttribute('id') || 
                    'quiz-' + Date.now(); 
      quizData.title = quizContainer.getAttribute('data-quiz-title') ||  
                      document.title || 
                      'HTML Quiz'; 
      return quizData; 
    } 

    // Method 3: Generate from page info 
    quizData.id = 'quiz-' + btoa(window.location.pathname).replace(/[^a-zA-Z0-9]/g, '').substring(0, 10); 
    quizData.title = document.title || 'HTML Quiz'; 

    return quizData; 
  } 

  function sendTrackingData(data) { 
    const githubUser = 'mmm9383'; 
    const githubRepo = 'quiz'; 
    const trackingUrl = "https://" + githubUser + ".github.io/" + githubRepo + "/track.html"; 

    const params = new URLSearchParams(); 
    Object.keys(data).forEach(key => { 
      if (data[key] !== null && data[key] !== undefined) { 
        params.append(key, data[key].toString()); 
      } 
    }); 

    const fullTrackingUrl = trackingUrl + '?' + params.toString(); 

    // ✅ Use iframe method only (GitHub Pages compatible) 
    const iframe = document.createElement('iframe'); 
    iframe.src = fullTrackingUrl; 
    iframe.style.display = 'none'; 
    iframe.loading = 'eager'; 
    iframe.width = '1'; 
    iframe.height = '1'; 
    iframe.referrerPolicy = 'no-referrer'; 
    iframe.sandbox = 'allow-scripts allow-same-origin'; 

    document.body.appendChild(iframe); 

    // Remove the iframe after it has had time to load 
    setTimeout(() => { 
      if (iframe.parentNode) { 
        iframe.parentNode.removeChild(iframe); 
      } 
    }, 5000); 

    console.log('✅ Quiz tracking sent via iframe:', fullTrackingUrl); 
  } 

  function trackQuizOpen() { 
    // Prevent duplicate tracking
    if (quizOpenTracked) {
      console.log('Quiz open already tracked, skipping...');
      return;
    }

    // Get quiz data 
    const quizData = getQuizData(); 

    if (!quizData.id) { 
      console.warn('Quiz tracking: No quiz ID found'); 
      return; 
    } 

    const trackingData = { 
      quiz_title: quizData.title || 'Unknown Quiz', 
      quiz_id: quizData.id, 
      timestamp: Date.now(), 
      // Removed: quiz_url, user_agent, referrer, screen_resolution - not needed
      event_type: 'quiz_open' 
    }; 

    sendTrackingData(trackingData); 
    quizOpenTracked = true; // Mark as tracked
  } 

  function trackQuizComplete(score, totalQuestions, timeSpent) { 
    const quizData = getQuizData(); 

    if (!quizData.id) { 
      console.warn('Quiz tracking: No quiz ID found for completion'); 
      return; 
    } 

    const trackingData = { 
      quiz_title: quizData.title || 'Unknown Quiz', 
      quiz_id: quizData.id, 
      timestamp: Date.now(), 
      // Removed: quiz_url - not needed
      score: score || 0, 
      total_questions: totalQuestions || 0, 
      time_spent: timeSpent || 0, 
      completion_rate: totalQuestions > 0 ? (score / totalQuestions * 100) : 0, 
      event_type: 'quiz_complete' 
    }; 

    sendTrackingData(trackingData); 
  } 

  // Single tracking initialization - prevent duplicates
  function initializeQuizTracking() {
    if (quizOpenTracked) return; // Already initialized

    // Only track once when everything is ready
    if (document.readyState === 'complete') {
      setTimeout(trackQuizOpen, 1000);
    } else {
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(trackQuizOpen, 1000);
      });
    }
  }

  // Initialize tracking when script loads
  initializeTracking();
  initializeQuizTracking();

  // Export functions for manual use 
  window.trackQuizOpen = trackQuizOpen; 
  window.trackQuizComplete = trackQuizComplete; 
  </script>
  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');

    // Function to update icons based on current theme
    function updateThemeIcons(isDark) {
      if (sunIcon && moonIcon) {
        if (isDark) {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'block';
        } else {
          sunIcon.style.display = 'block';
          moonIcon.style.display = 'none';
        }
      }
    }

    // Theme handling that only uses user choice
    const savedTheme = localStorage.getItem('quiz-theme');

    // Set initial theme - prefer saved theme if it exists, otherwise default to light
    const initialTheme = savedTheme || 'light';

    // Always ensure one theme class is set
    document.body.classList.add(initialTheme);
    updateThemeIcons(initialTheme === 'dark');

    // Toggle theme when the button is clicked
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const isDarkMode = document.body.classList.contains('dark');
        const newTheme = isDarkMode ? 'light' : 'dark';

        // Simple toggle between classes
        document.body.classList.remove('dark', 'light');
        document.body.classList.add(newTheme);

        localStorage.setItem('quiz-theme', newTheme);
        updateThemeIcons(newTheme === 'dark');
      });
    }
  </script>
